services:
  mongodb:
    # mongo:4.4.18 es la versión oficial recomendada y compatible con Raspberry Pi 3 (ARMv8 Cortex-A53)
    # Evita el fallo de 'Illegal instruction (core dumped)' de MongoDB 5+ en procesadores ARMv8.0
    image: mongo:4.4.18
    container_name: formatos_cuentas_db
    # Limita la memoria caché de WiredTiger a 256MB para no saturar el 1GB de RAM de la Raspberry Pi
    command: mongod --wiredTigerCacheSizeGB 0.25
    ports:
      - "27019:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 380M

  backend:
    build: 
      context: ./backend
    container_name: formatos_cuentas_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/formatos_cuentas}
      - JWT_SECRET=${JWT_SECRET:-supersecretkey_change_me_in_production}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - NODE_ENV=production
      - SMMLV=${SMMLV:-1423500}
    volumes:
      - backend_uploads:/app/uploads
      - backend_generated:/app/generated
      - backend_templates:/app/templates
    depends_on:
      - mongodb
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 350M

  frontend:
    build:
      context: ./frontend
    container_name: formatos_cuentas_frontend
    ports:
      - "80:80"
      - "5173:80"
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 150M

volumes:
  mongodb_data:
  backend_uploads:
  backend_generated:
  backend_templates:
